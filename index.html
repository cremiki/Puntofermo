/* Layout: top bar with mode switch; kiosk = dark tablet in warm charcoal, admin = slate sidebar + light work area.
   Deliberate fixed palette (kiosk dark / admin light), so no theme switching. */
:root {
  --ink: #0f172a;

html, body { background: var(--char); color: var(--ink); }

.font-mono { font-family: var(--font-mono); }

.tabular-nums { font-variant-numeric: tabular-nums; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.kiosk-bg { background: radial-gradient(1200px 500px at 50% -10%, #3a2616 0%, transparent 60%), var(--char); }
.cam-noise { background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 3px 3px; }
.vf .corner, .vf-ok .corner, .vf-err .corner { position: absolute; width: 34px; height: 34px; border-color: #fbbf24; border-style: solid; border-width: 0; transition: border-color .3s; }
.vf-ok .corner { border-color: #34d399; } .vf-err .corner { border-color: #f87171; }
.corner.tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 10px; }
.corner.tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 10px; }
.corner.bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 10px; }
.corner.br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 10px; }
.scanline { position: absolute; left: 6%; right: 6%; height: 2px; background: linear-gradient(90deg, transparent, #fbbf24, transparent); box-shadow: 0 0 14px 2px rgba(251,191,36,.55); animation: scan 2.4s ease-in-out infinite; }
.scanline.fast { animation-duration: .7s; }
@keyframes scan { 0%,100% { top: 8%; } 50% { top: 90%; } }
.blink { animation: blink 1s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } }

.kbtn { display: flex; align-items: center; justify-content: center; gap: .75rem; width: 100%; border-radius: 1.25rem; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; box-shadow: 0 10px 0 -2px var(--tw-shadow-color, rgba(0,0,0,.4)), 0 18px 30px -12px rgba(0,0,0,.6); transition: transform .12s, filter .12s; }
.kbtn:active { transform: translateY(6px); box-shadow: 0 3px 0 -2px rgba(0,0,0,.4); }

.sel { height: 38px; border-radius: .6rem; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; padding: 0 .75rem; font-size: .875rem; }
.sel:hover { border-color: #94a3b8; }
.btn-ghost, .btn-primary, .btn-dark { display: inline-flex; align-items: center; gap: .45rem; height: 38px; padding: 0 .9rem; border-radius: .6rem; font-size: .875rem; font-weight: 600; transition: background .15s, transform .1s, box-shadow .15s; }
.btn-ghost { background: #fff; color: #1e293b; box-shadow: inset 0 0 0 1px #cbd5e1; }
.btn-ghost:hover { background: #f8fafc; box-shadow: inset 0 0 0 1px #94a3b8; }
.btn-primary { background: var(--brand); color: #fff; } .btn-primary:hover { background: #c2410c; }
.btn-dark { background: #0f172a; color: #fff; } .btn-dark:hover { background: #1e293b; }
.btn-ghost:active, .btn-primary:active, .btn-dark:active { transform: scale(.97); }
.icon-btn { height: 32px; width: 32px; display: grid; place-items: center; border-radius: .5rem; color: #334155; box-shadow: inset 0 0 0 1px #cbd5e1; background: #fff; }
.icon-btn:hover { background: #f1f5f9; }
.stat { background: #fff; border-radius: .75rem; box-shadow: inset 0 0 0 1px #e2e8f0; padding: 1rem; }
.stat-l { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #64748b; font-weight: 600; }
.stat-v { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; margin-top: .5rem; color: #0f172a; font-variant-numeric: tabular-nums; }
.stat-s { font-size: 12px; color: #64748b; margin-top: .35rem; }

.fade-in { animation: fade .25s ease-out both; }
.pop-in { animation: pop .28s cubic-bezier(.2,.9,.3,1.3) both; }
.slide-up { animation: slideup .3s ease-out both; }
.drawer-in { animation: drawerin .28s cubic-bezier(.2,.8,.2,1) both; }
@keyframes drawerin { from { transform: translateX(40px); opacity: .3; } to { transform: none; opacity: 1; } }
.toast-in { animation: toastin .3s cubic-bezier(.2,.9,.3,1.2) both; }
.shake { animation: shake .4s; }
.flash { animation: flash 2.2s ease-out; }
@keyframes fade { from { opacity: .0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(.9); opacity: .4; } to { transform: scale(1); opacity: 1; } }
@keyframes slideup { from { transform: translateY(8px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes toastin { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }

#boot { color: #fcd34d; font-family: var(--font-body); padding: 40px 16px; text-align: center; }
